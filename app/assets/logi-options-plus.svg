<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de Fundo Squircle -->
    <linearGradient id="bg-grad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1f28"/>
      <stop offset="50%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Gradiente Borda Sutil -->
    <linearGradient id="border-grad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#384052"/>
      <stop offset="50%" stop-color="#1f2430"/>
      <stop offset="100%" stop-color="#00e5c9" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Gradiente do Mouse MX Master -->
    <linearGradient id="mouse-grad" x1="160" y1="120" x2="340" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8ecf4"/>
      <stop offset="60%" stop-color="#b0b8c8"/>
      <stop offset="100%" stop-color="#646e82"/>
    </linearGradient>

    <!-- Gradiente da Roda MagSpeed Ciano / Prata -->
    <linearGradient id="wheel-grad" x1="236" y1="120" x2="276" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5c9"/>
      <stop offset="100%" stop-color="#00a894"/>
    </linearGradient>

    <!-- Brilho do Ciano Oficial -->
    <filter id="glow-cyan" x="280" y="280" width="200" height="200" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Estilo GNOME/macOS -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4"/>

  <!-- Brilho Interno Suave -->
  <circle cx="256" cy="220" r="160" fill="#00e5c9" fill-opacity="0.06"/>

  <!-- Silhueta 3D Elegante do MX Master 3S -->
  <g transform="translate(10, -10)">
    <!-- Corpo Principal do Mouse -->
    <path d="M 230 110 
             C 285 110, 335 155, 335 240
             C 335 315, 295 375, 240 375
             C 195 375, 155 330, 155 250
             C 155 170, 185 110, 230 110 Z" 
          fill="url(#mouse-grad)"/>

    <!-- Apoio Ergonômico de Polegar com Textura -->
    <path d="M 175 220 
             C 140 235, 115 270, 125 320 
             C 133 360, 175 370, 205 370 
             C 185 345, 175 295, 175 220 Z" 
          fill="#485060"/>

    <!-- Linha Divisória de Botões -->
    <path d="M 245 110 L 245 230" stroke="#1c1f28" stroke-width="4" stroke-linecap="round"/>

    <!-- Roda MagSpeed Metálica com Destaque Ciano -->
    <rect x="233" y="145" width="24" height="60" rx="10" fill="#141720" stroke="#00e5c9" stroke-width="3"/>
    <line x1="237" y1="165" x2="253" y2="165" stroke="#00e5c9" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="237" y1="175" x2="253" y2="175" stroke="#00e5c9" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="237" y1="185" x2="253" y2="185" stroke="#00e5c9" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Botão de Mode Shift -->
    <rect x="238" y="220" width="14" height="18" rx="5" fill="#202532" stroke="#8892a4" stroke-width="1.5"/>

    <!-- Thumbwheel Lateral -->
    <rect x="156" y="240" width="12" height="32" rx="4" fill="#00e5c9"/>
  </g>

  <!-- Emblema Oficial "PLUS" (+) Ciano Radiante no Canto Inferior Direito -->
  <g filter="url(#glow-cyan)">
    <!-- Círculo de Fundo do Plus -->
    <circle cx="375" cy="375" r="54" fill="#00e5c9"/>
    
    <!-- Símbolo Mais (+) -->
    <path d="M 375 345 L 375 405 M 345 375 L 405 375" 
          stroke="#090b10" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
